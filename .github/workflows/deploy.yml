# Deploys the web app (webapp/: the Worker and the app's files) to
# Cloudflare: by hand from the Actions tab, and by itself when a push to
# main changes webapp/. Needs two repository secrets, made by the owner:
#   CLOUDFLARE_API_TOKEN   - My Profile -> API Tokens -> Create Token ->
#                            template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  - Workers & Pages -> Account details -> Account ID
# Without them the job says so and stops; nothing else is touched.
# Migrations go through the Worker after the deploy (Version 3.46) with the
# service token: HOTMONITOR_URL, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET.
name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["webapp/**"]
  # The morning run commits the day's shareable image with the workflow's own
  # token, which starts no push workflow: deploy after it instead.
  workflow_run:
    workflows: ["Scheduled jobs"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-webapp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets (see the top of deploy.yml)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          node --check src/worker.js
          node --check public/app.js
          node scripts/auth_test.mjs
          node scripts/clock_test.mjs
          node scripts/launch_test.mjs
          node scripts/push_test.mjs
          node scripts/retry_test.mjs
          node scripts/bundle_migrations.mjs --check
          node --no-warnings scripts/migrate_test.mjs
      - name: Install wrangler
        run: npm ci --no-audit --no-fund
      - name: Deploy
        # Pasted secrets often end in a newline or a space; wrangler refuses them.
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx wrangler deploy
      - name: Database migrations
        # Version 3.46: the Worker applies the pending migrations itself
        # (POST /api/ingest/migrate with the service token): the deploy token
        # lacks D1 Edit, so `wrangler d1 migrations apply` was refused.
        env:
          HOTMONITOR_URL: ${{ secrets.HOTMONITOR_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          URL="$(printf %s "$HOTMONITOR_URL" | tr -d '[:space:]')"
          if [ -z "$URL" ] || [ -z "$CF_ACCESS_CLIENT_ID" ]; then echo "::warning::HOTMONITOR_URL / CF_ACCESS_* not set - migrations not applied"; exit 0; fi
          OUT=$(curl -sS -w '\n%{http_code}' -X POST "$URL/api/ingest/migrate" \
            -H "CF-Access-Client-Id: $(printf %s "$CF_ACCESS_CLIENT_ID" | tr -d '[:space:]')" \
            -H "CF-Access-Client-Secret: $(printf %s "$CF_ACCESS_CLIENT_SECRET" | tr -d '[:space:]')" \
            -H "User-Agent: hotmonitor-deploy/1")
          CODE=$(printf '%s' "$OUT" | tail -n1); BODY=$(printf '%s' "$OUT" | sed '$d')
          echo "Migrations: HTTP $CODE $BODY"
          [ "$CODE" = "200" ] || { echo "::error::Migrations failed: $BODY"; exit 1; }
      - name: Check
        run: |
          VERSION=$(grep -o "hm-v[0-9.]*" public/sw.js | head -1)
          echo "Deployed $VERSION"
