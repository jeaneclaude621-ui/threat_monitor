# Deploys the web app (webapp/: the Worker and the app's files) to
# Cloudflare: by hand from the Actions tab, and by itself when a push to
# main changes webapp/. Needs two repository secrets, made by the owner:
#   CLOUDFLARE_API_TOKEN   - My Profile -> API Tokens -> Create Token ->
#                            template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  - Workers & Pages -> Account details -> Account ID
# Without them the job says so and stops; nothing else is touched.
name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["webapp/**"]

concurrency:
  group: deploy-webapp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets (see the top of deploy.yml)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          node --check src/worker.js
          node --check public/app.js
          node scripts/auth_test.mjs
          node scripts/clock_test.mjs
      - name: Install wrangler
        run: npm ci --no-audit --no-fund
      - name: Database migrations
        # Needs D1 Edit on the token; without it the step says so and the
        # deploy goes on (the new tables are then missing until it is added).
        continue-on-error: true
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx wrangler d1 migrations apply hotmonitor --remote
      - name: Deploy
        # Pasted secrets often end in a newline or a space; wrangler refuses them.
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx wrangler deploy
      - name: Check
        run: |
          VERSION=$(grep -o "hm-v[0-9.]*" public/sw.js | head -1)
          echo "Deployed $VERSION"
