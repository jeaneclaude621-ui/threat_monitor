# The trends feed (src/trends.py), apart from the analysis. The web app's
# Worker starts it at 08:00, 12:00, 16:00 and 21:00 Stockholm with `at`
# set to that hour (webapp/CONTRACT.md, Version 3.9); GitHub's own schedule,
# at both UTC hours of each, is the fallback, and run_job.py --at lets the
# first start that is due run and the others skip. Its own concurrency
# group, so it never holds up or cancels the report or the thread checks;
# run_job.py replays its commit if they push the state at the same time.
name: Trends

on:
  schedule:
    - cron: "15 6,7,10,11,14,15,19,20 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: nothing uploaded or saved, no Gemini call"
        type: boolean
        default: true
      at:
        description: "Stockholm hour the run is due (set by the Worker); skips the run if it already ran"
        type: string
        default: ""

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Fetch the run state
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: bash schedule/fetch_state.sh

      - name: Collect trends
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HOTMONITOR_URL: ${{ secrets.HOTMONITOR_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TEST: ${{ inputs.test }}
          DISPATCH_AT: ${{ inputs.at }}
        run: |
          set -o pipefail
          if [ -n "$SCHEDULE" ]; then
            python schedule/run_job.py --at 8,12,16,21 trends
          elif [ "$DISPATCH_TEST" = "true" ]; then
            python src/trends.py --dry-run
          elif [ -n "$DISPATCH_AT" ]; then
            python schedule/run_job.py --at "$DISPATCH_AT" trends
          else
            python schedule/run_job.py trends
          fi
