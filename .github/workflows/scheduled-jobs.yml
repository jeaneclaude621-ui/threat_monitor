# The daily report and the hourly monitor. schedule/run_job.py pulls the
# run state before each job and pushes it after.
#
# GitHub's cron is UTC, so each job fires at both UTC hours that can be its
# Stockholm hour (summer and winter time); run_job.py --at lets the first
# firing that is due run and the other skip.
name: Scheduled jobs

on:
  schedule:
    - cron: "0 3,4 * * *"        # daily report, 05:00 Stockholm
    - cron: "0 23,0,14,15 * * *" # hourly monitor, 01:00 and 16:00 Stockholm
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [hourly, daily]
      test:
        description: "Test run: mail to the sender only, no app upload, nothing saved"
        type: boolean
        default: true

# One run at a time, so two runs never push the state against each other.
concurrency:
  group: run-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Fetch the run state
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: bash schedule/fetch_state.sh

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HOTMONITOR_URL: ${{ secrets.HOTMONITOR_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_JOB: ${{ inputs.job }}
          DISPATCH_TEST: ${{ inputs.test }}
        run: |
          set -o pipefail
          if [ "$SCHEDULE" = "0 3,4 * * *" ]; then
            ARGS="--at 5 daily"
          elif [ -n "$SCHEDULE" ]; then
            ARGS="--at 1,16 hourly"
          elif [ "$DISPATCH_TEST" = "true" ]; then
            # Test: the report goes to the sending account only, nothing is
            # uploaded to the app, and replies are read but left unread.
            export MAIL_TO="$MAIL_FROM" HOTMONITOR_URL="" REPLY_CHECK_DRY_RUN=1
            ARGS="--test $DISPATCH_JOB"
          else
            ARGS="$DISPATCH_JOB"
          fi
          JOB="${ARGS##* }"
          python schedule/run_job.py $ARGS 2>&1 | tee -a "data/logs/${JOB}_run_cloud.log"

      - name: Keep the report deck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/*.pptx
          if-no-files-found: ignore
          retention-days: 30
