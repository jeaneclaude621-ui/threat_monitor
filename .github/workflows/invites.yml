# Version 3.31: invitations are links the admin passes on themselves (the
# admin page shows them); nothing is mailed and this job has no schedule.
# Kept to run by hand, should an old mail invitation ever need sending
# (src/app_mail.py send-invites).
name: Invitations

on:
  workflow_dispatch:
concurrency:
  group: invites
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the run state
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: bash schedule/fetch_state.sh

      - name: Send invitations
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          HOTMONITOR_URL: ${{ secrets.HOTMONITOR_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python schedule/run_job.py invites
